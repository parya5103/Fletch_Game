  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVzc3pjbmFheWxic2dxYWVoc2dwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4ODY4ODMsImV4cCI6MjEwNzQ2Mjg4M30\.6LQPGdiJ8ggDgCdJdTXmxQNkBjV0fA0_vXYHehExMzc''',
]

[[allowlists]]
description = "VAPID public key is public by design (pairs with the repo secret PUSH_VAPID_PRIVATE_KEY). Appears in the historical one-off debug workflow .github/workflows/dbg-supabase.yml, which was deleted from HEAD the same day it was added."
regexes = [
  '''BCZi4Grxq_wVF9j-pIP7buv5lwCGfSdNCrDmRaeuojmIwkCQCK1o2NdqIIqamu4nuW1Yn3doDR31W1opJzR_9H4''',
