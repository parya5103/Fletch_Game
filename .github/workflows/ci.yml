name: CI

on:
  push:
    branches: [main, 'security-v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: tests only need to read the repo contents
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Pinned to the immutable commit SHA of the v4 tag
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Syntax check all JS
        run: |
          status=0
          for f in js/*.js sw.js scripts/*.js; do
            [ -f "$f" ] || continue
            if node --check "$f"; then
              echo "ok - $f"
            else
              echo "syntax error in $f"
              status=1
            fi
          done
          exit $status

      - name: Game logic smoke tests
        run: node scripts/ci-test.js

      - name: Cross-tab save conflict tests
        run: node scripts/conflict-test.js

      - name: World map module tests
        run: node scripts/map-redesign-test.js
      - name: Commercial upgrade tests
        run: node scripts/commercial-test.js

      - name: State, storage, audio and PWA regressions
        run: |
          node scripts/regression-test.js
          node scripts/audit-test.js
          node scripts/reminders-test.js

      - name: Dense boards, camera, touch and save compatibility
        run: |
          node scripts/density-test.js
          node scripts/cosmetics-test.js

      - name: Public pages, Contact privacy and documentation links
        run: node scripts/pages-test.js

      - name: Independent full campaign and daily validation
        run: timeout 180s node scripts/validate-levels.js
