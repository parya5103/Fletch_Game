# One-off probe v2: insert policy was fixed via SQL but the game still
# shows "Could not save reminders". Isolate: (a) does a real player row
# exist now (service-key fetch), (b) does a plain anon INSERT work now,
# (c) does the upsert (Prefer merge-duplicates) work — this needs the
# endpoint primary key, (d) anon delete cleanup.
# Result committed to docs/dbg-supabase.txt. DELETE THIS FILE after use.
name: Debug Supabase 2

on:
  push:
    branches: [main]
    paths: ['.github/workflows/dbg-supabase.yml']
  workflow_dispatch:

jobs:
  dbg:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Probe Supabase roster
        env:
          SUPABASE_URL: https://usszcnaaylbsgqaehsgp.supabase.co
          ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVzc3pjbmFheWxic2dxYWVoc2dwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4ODY4ODMsImV4cCI6MjEwNzQ2Mjg4M30.6LQPGdiJ8ggDgCdJdTXmxQNkBjV0fA0_vXYHehExMzc
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          mkdir -p docs
          cat > probe.js <<'EOF'
          const BASE = process.env.SUPABASE_URL;
          const ANON = process.env.ANON_KEY;
          const SVC = (process.env.SERVICE_KEY || '').trim();
          const EP = 'https://debug.example/probe2-' + process.env.GITHUB_RUN_ID;

          async function req(label, url, opts) {
            try {
              const r = await fetch(url, opts);
              const t = await r.text();
              console.log(label + ': HTTP ' + r.status + ' | ' + t.slice(0, 300));
              return { status: r.status, body: t };
            } catch (e) {
              console.log(label + ': FETCH ERROR ' + e.message);
              return { status: 0 };
            }
          }

          (async () => {
            const anon = { 'apikey': ANON, 'Authorization': 'Bearer ' + ANON, 'Content-Type': 'application/json' };

            console.log('--- 1. service-key roster fetch (does a real player row exist?) ---');
            if (SVC) {
              const r = await req('roster', BASE + '/rest/v1/push_subscriptions?select=endpoint,subscription', {
                headers: { 'apikey': SVC, 'Authorization': 'Bearer ' + SVC }
              });
              try {
                const rows = JSON.parse(r.body);
                console.log('roster row count: ' + (Array.isArray(rows) ? rows.length : 'not-array'));
                if (Array.isArray(rows)) rows.forEach(function (row) {
                  console.log('  row endpoint: ' + (row.endpoint || '(none)'));
                });
              } catch (e) {}
            } else {
              console.log('SUPABASE_SERVICE_KEY secret NOT SET');
            }

            const body = JSON.stringify({ endpoint: EP, subscription: { endpoint: EP, keys: { p256dh: 'probe', auth: 'probe' } } });

            console.log('--- 2. anon plain INSERT (no Prefer header) ---');
            await req('plainInsert', BASE + '/rest/v1/push_subscriptions', { method: 'POST', headers: anon, body: body });

            console.log('--- 3. anon UPSERT INSERT (Prefer merge-duplicates, exactly like the game) ---');
            await req('upsertInsert', BASE + '/rest/v1/push_subscriptions', {
              method: 'POST',
              headers: Object.assign({}, anon, { 'Prefer': 'resolution=merge-duplicates' }),
              body: body
            });

            console.log('--- 4. anon DELETE (probe cleanup) ---');
            await req('delete', BASE + '/rest/v1/push_subscriptions?endpoint=eq.' + encodeURIComponent(EP), {
              method: 'DELETE',
              headers: { 'apikey': ANON, 'Authorization': 'Bearer ' + ANON }
            });
            console.log('=== probe done ===');
          })();
          EOF
          node probe.js | tee docs/dbg-supabase.txt

      - name: Commit probe result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dbg-supabase.txt
          if git diff --cached --quiet; then
            echo "No probe result to commit"
          else
            git commit -m "chore: supabase probe2 result [skip ci]"
            git push
          fi
