name: Lighthouse

on:
  push:
    branches: [main]
  workflow_dispatch:

# Advisory-only job: read access is all it needs
permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      # Pinned to the immutable commit SHA of the v4 tag
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      # Advisory only - failures here do not block anything.
      - name: Run Lighthouse on the live site
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.2
        with:
          urls: |
            https://gogocompany.in/arrowout/
          uploadArtifacts: true
          temporaryPublicStorage: true
        continue-on-error: true
