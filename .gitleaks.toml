# Gitleaks configuration: default rules plus documented, project-specific allowlists.
[extend]
useDefault = true

[[allowlists]]
description = "Supabase anon key is public by design: a frontend client key paired with an insert/delete-only RLS policy on the push_subscriptions table. Present in js/pwa.js by architecture, not a leak."
