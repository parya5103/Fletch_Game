name: Screenshots

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'scripts/screenshot.js'
      - '.github/workflows/screenshot.yml'
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Install deps
        # Supply chain: this job has contents:write, so never install
        # floating "latest" versions. Update process: bump both exact pins,
        # run this workflow via workflow_dispatch, require the log to end
        # with "ALL CHECKS PASSED", then merge. Dependabot does not manage
        # these inline versions.
        run: npm install --no-save puppeteer@25.16.0 http-server@14.1.1

      - name: Capture screenshots
        run: node scripts/screenshot.js

      - name: Commit screenshots and test log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No doc changes"
          else
            git commit -m "chore: update screenshots + test log [skip ci]"
            git push
          fi
