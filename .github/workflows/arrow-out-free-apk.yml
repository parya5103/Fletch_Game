name: Arrow Out Free Android APK

on:
  push:
    branches:
      - feat/native-cocos2dx-v4-vertical-slice
    paths:
      - "android-native/**"
      - "js/game.js"
      - "scripts/generate-native-levels.cjs"
      - ".github/workflows/arrow-out-free-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arrow-out-free-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Test and build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platforms;android-37" "build-tools;36.0.0"
          sdkmanager --list_installed

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Generate and solver-validate campaign and daily levels
        run: node scripts/generate-native-levels.cjs

      - name: Run unit tests and assemble debug APK
        working-directory: android-native
        run: |
          gradle --no-daemon :app:testDebugUnitTest
          gradle --no-daemon :app:assembleDebug

      - name: Verify APK exists and report package metadata
        run: |
          APK="android-native/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_STEP_SUMMARY"
          ls -lh "$APK"
          sha256sum "$APK" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: arrow-out-debug-apk
          path: android-native/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
