# One-off probe: WHY did the in-game "Could not save reminders" toast fire?
# Tests (from GitHub's network, like the real notify.yml):
#   1. anon INSERT (upsert) into push_subscriptions - RLS insert policy + PK check
#   2. anon DELETE of the probe row - delete policy check
#   3. service-key roster fetch - SUPABASE_SERVICE_KEY secret check
#   4. VAPID key pair - derives the public key from PUSH_VAPID_PRIVATE_KEY
# Result is committed to docs/dbg-supabase.txt. DELETE THIS FILE after reading.
name: Debug Supabase

on:
  push:
    branches: [main]
    paths: ['.github/workflows/dbg-supabase.yml']
  workflow_dispatch:

jobs:
  dbg:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Probe Supabase roster
        env:
          SUPABASE_URL: https://usszcnaaylbsgqaehsgp.supabase.co
          ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVzc3pjbmFheWxic2dxYWVoc2dwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4ODY4ODMsImV4cCI6MjEwNzQ2Mjg4M30.6LQPGdiJ8ggDgCdJdTXmxQNkBjV0fA0_vXYHehExMzc
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PRIVATE: ${{ secrets.PUSH_VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC: BCZi4Grxq_wVF9j-pIP7buv5lwCGfSdNCrDmRaeuojmIwkCQCK1o2NdqIIqamu4nuW1Yn3doDR31W1opJzR_9H4
        run: |
          mkdir -p docs
          cat > probe.js <<'EOF'
          const BASE = process.env.SUPABASE_URL;
          const ANON = process.env.ANON_KEY;
          const SVC = (process.env.SERVICE_KEY || '').trim();
          const PRIV = (process.env.VAPID_PRIVATE || '').trim();
          const PUB = process.env.VAPID_PUBLIC;
          const EP = 'https://debug.example/probe-' + process.env.GITHUB_RUN_ID;

          async function req(label, url, opts) {
            try {
              const r = await fetch(url, opts);
              const t = await r.text();
              console.log(label + ': HTTP ' + r.status + ' | ' + t.slice(0, 300));
              return r.status;
            } catch (e) {
              console.log(label + ': FETCH ERROR ' + e.message);
              return 0;
            }
          }

          (async () => {
            console.log('=== probe row: ' + EP + ' ===');
            const h = {
              'apikey': ANON,
              'Authorization': 'Bearer ' + ANON,
              'Content-Type': 'application/json',
              'Prefer': 'resolution=merge-duplicates'
            };
            console.log('--- 1. anon INSERT (upsert) ---');
            await req('insert', BASE + '/rest/v1/push_subscriptions', {
              method: 'POST', headers: h,
              body: JSON.stringify({ endpoint: EP, subscription: { endpoint: EP, keys: { p256dh: 'probe', auth: 'probe' } } })
            });
            console.log('--- 2. anon DELETE (probe cleanup + policy check) ---');
            await req('delete', BASE + '/rest/v1/push_subscriptions?endpoint=eq.' + encodeURIComponent(EP), {
              method: 'DELETE',
              headers: { 'apikey': ANON, 'Authorization': 'Bearer ' + ANON }
            });
            console.log('--- 3. service-key roster fetch (notify.yml path) ---');
            console.log('SUPABASE_SERVICE_KEY secret set: ' + (SVC ? 'YES (len ' + SVC.length + ')' : 'NO'));
            if (SVC) {
              await req('roster', BASE + '/rest/v1/push_subscriptions?select=subscription', {
                headers: { 'apikey': SVC, 'Authorization': 'Bearer ' + SVC }
              });
            }
            console.log('--- 4. VAPID key pair ---');
            console.log('PUSH_VAPID_PRIVATE_KEY secret set: ' + (PRIV ? 'YES (len ' + PRIV.length + ')' : 'NO'));
            if (PRIV) {
              try {
                const crypto = require('crypto');
                const b2b = (s) => Buffer.from(s.replace(/-/g, '+').replace(/_/g, '/'), 'base64');
                const b2u = (b) => b.toString('base64').replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
                const pub = crypto.createPublicKey({ key: { kty: 'EC', crv: 'P-256', d: b2b(PRIV) }, format: 'jwk' });
                const raw = pub.export({ type: 'spki', format: 'der' });
                const derived = b2u(raw.slice(-65));
                console.log('derived public: ' + derived);
                console.log('game public:   ' + PUB);
                console.log('MATCH: ' + (derived === PUB));
              } catch (e) {
                console.log('VAPID derive FAILED: ' + e.message);
              }
            }
            console.log('=== probe done ===');
          })();
          EOF
          node probe.js | tee docs/dbg-supabase.txt

      - name: Commit probe result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dbg-supabase.txt
          if git diff --cached --quiet; then
            echo "No probe result to commit"
          else
            git commit -m "chore: supabase probe result [skip ci]"
            git push
          fi
