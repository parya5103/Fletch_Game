# Daily reminders: sends 4-5 short local-time push notifications per day
# to subscribed players. This scheduled workflow is the "push server" for
# the static site - no paid backend needed.
#
# One-time setup (repo owner):
#   1. Settings -> Secrets and variables -> Actions -> New repository secret
#      Name: PUSH_VAPID_PRIVATE_KEY
#      Value: the VAPID private key that pairs with the public key in js/pwa.js
#   2. New repository secret: SUPABASE_SERVICE_KEY
#      Value: the service_role key of the Supabase project (allows reading
#      the push_subscriptions table; never put it in client code).
#
# Players never copy-paste anything: the game auto-saves each player's
# push subscription to the Supabase push_subscriptions table when they
# toggle Settings -> Daily reminders ON (anon key, insert/delete-only RLS).
# This workflow reads that roster with the service key and sends, and
# automatically prunes roster rows whose push endpoints return HTTP
# 404/410 (expired subscriptions) so the roster never rots.
#
# The workflow exits cleanly while secrets are unset, so it is safe to
# merge before setup. Push payloads are validated again in sw.js.
name: Daily reminders (web push)

on:
  schedule:
    # GitHub cron is UTC and can drift a few minutes. These are
    # 10:00, 12:30, 17:00, 19:30, 23:00 in India (IST).
    - cron: '30 4 * * *'
    - cron: '0 7 * * *'
    - cron: '30 11 * * *'
    - cron: '0 14 * * *'
    - cron: '30 17 * * *'
  workflow_dispatch:

# This job only sends push messages through the Web Push API and reads
# the subscription roster from Supabase. It never reads or writes
# repository contents.
permissions:
  contents: none

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      # Pinned to the immutable commit SHA of the v4 tag
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Send daily reminder pushes
        env:
          SUPABASE_URL: https://usszcnaaylbsgqaehsgp.supabase.co
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PRIVATE: ${{ secrets.PUSH_VAPID_PRIVATE_KEY }}
        run: |
          mkdir -p /tmp/push && cd /tmp/push
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund --loglevel=error web-push@3.6.7
          cat > send.js <<'EOF'
          const webpush = require('web-push');
          // Must match VAPID_PUBLIC_KEY in js/pwa.js
          const PUB = 'BCZi4Grxq_wVF9j-pIP7buv5lwCGfSdNCrDmRaeuojmIwkCQCK1o2NdqIIqamu4nuW1Yn3doDR31W1opJzR_9H4';
          const MESSAGES = [
            'Daily challenge is live - a fresh puzzle is waiting!',
            "Don't break your streak - play today's daily challenge!",
            'Bonus coins are hiding on levels ending in 5 - come grab them!',
            '3 free hints per level, refilled - the next level is calling!',
            'Your arrows are getting restless - tap one out of the board!'
          ];

          async function main() {
            const priv = (process.env.VAPID_PRIVATE || '').trim();
            if (!priv) {
              console.log('ERROR: PUSH_VAPID_PRIVATE_KEY secret not set (see README).');
              return 1;
            }
            const serviceKey = (process.env.SERVICE_KEY || '').trim();
            if (!serviceKey) {
              console.log('SUPABASE_SERVICE_KEY secret not set yet - nothing to send.');
              return 0;
            }

            // Fetch the roster the game maintains in Supabase
            const url = process.env.SUPABASE_URL + '/rest/v1/push_subscriptions?select=subscription';
            let roster;
            try {
              const resp = await fetch(url, {
                headers: {
                  'apikey': serviceKey,
                  'Authorization': 'Bearer ' + serviceKey
                }
              });
              if (!resp.ok) {
                console.log('ERROR: Supabase roster fetch failed (HTTP ' + resp.status + ').');
                return 1;
              }
              const rows = await resp.json();
              roster = Array.isArray(rows) ? rows : [];
            } catch (e) {
              console.log('ERROR: Supabase roster fetch error: ' + e.message);
              return 1;
            }
            if (!roster.length) {
              console.log('Roster is empty - no subscribers yet.');
              return 0;
            }

            webpush.setVapidDetails('mailto:parya5103@users.noreply.github.com', PUB, priv);

            // Rotate the message by day and send slot so it stays fresh
            const idx = (Math.floor(Date.now() / 86400000) + new Date().getUTCHours()) % MESSAGES.length;
            const payload = JSON.stringify({
              title: 'Arrow Out!',
              body: MESSAGES[idx],
              tag: 'arrow-out-daily',
              data: { url: './' }
            });

            let sent = 0, failed = 0;
            const expired = [];
            for (const row of roster) {
              const sub = row && row.subscription;
              if (!sub || !sub.endpoint) continue;
              try {
                await webpush.sendNotification(sub, payload, { TTL: 86400 });
                sent++;
                console.log('sent -> ' + sub.endpoint.slice(0, 48) + '...');
              } catch (err) {
                failed++;
                const status = err && err.statusCode ? err.statusCode : 'unknown';
                if (status === 404 || status === 410) {
                  expired.push(sub.endpoint);
                  console.log('EXPIRED (' + status + ') - queued for roster pruning.');
                } else {
                  console.log('failed (' + status + '): ' + (err && err.message ? err.message : 'unknown error'));
                }
              }
            }
            // Prune expired endpoints from the Supabase roster so dead
            // subscriptions never accumulate (the earlier pipeline's 410s).
            let pruned = 0;
            for (const endpoint of expired) {
              try {
                const resp = await fetch(process.env.SUPABASE_URL + '/rest/v1/push_subscriptions?endpoint=eq.' + encodeURIComponent(endpoint), {
                  method: 'DELETE',
                  headers: {
                    'apikey': serviceKey,
                    'Authorization': 'Bearer ' + serviceKey
                  }
                });
                if (resp.ok) {
                  pruned++;
                  console.log('pruned expired endpoint -> ' + endpoint.slice(0, 48) + '...');
                } else {
                  console.log('prune failed (HTTP ' + resp.status + ') for ' + endpoint.slice(0, 48) + '...');
                }
              } catch (e) {
                console.log('prune error: ' + e.message);
              }
            }
            console.log('done: ' + sent + ' sent, ' + failed + ' failed, ' + pruned + ' pruned.');
            return (sent === 0 && failed > 0) ? 1 : 0;
          }

          main().then(function (code) { process.exit(code); }).catch(function (e) { console.log('unexpected error: ' + e.message); process.exit(1); });
          EOF
          node send.js
