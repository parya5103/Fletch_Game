name: Lighthouse

on:
  push:
    branches: [main]
  workflow_dispatch:

# Advisory-only job: read access is all it needs
permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      # Pinned to the immutable commit SHA of the v4 tag
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      # Advisory only - failures here do not block anything.
      - name: Run Lighthouse on the live site
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.2
        with:
          urls: |
            https://parya5103.github.io/Fletch_Game/
          uploadArtifacts: true
          temporaryPublicStorage: true
        continue-on-error: true
