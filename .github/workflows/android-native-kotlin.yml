name: Android Native Kotlin
on:
  pull_request:
    paths: ['android-native/**','js/game.js','scripts/generate-native-levels.cjs','.github/workflows/android-native-kotlin.yml']
  push:
    branches: [main]
    paths: ['android-native/**','js/game.js','scripts/generate-native-levels.cjs','.github/workflows/android-native-kotlin.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Configure Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0"
      - name: Generate and validate all 1,000 native levels
        run: node scripts/generate-native-levels.cjs
      - name: Test and build
        working-directory: android-native
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:bundleRelease
      - uses: actions/upload-artifact@v7
        with:
          name: arrow-out-native-apk-aab
          path: |
            android-native/app/build/outputs/apk/debug/*.apk
            android-native/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
