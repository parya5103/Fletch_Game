name: Screenshots

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'scripts/screenshot.js'
      - '.github/workflows/screenshot.yml'
  workflow_dispatch:

concurrency:
  group: arrow-out-screenshot-main
  cancel-in-progress: false

jobs:
  screenshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install deps
        # Supply chain: this job has contents:write, so never install
        # floating "latest" versions. Update process: bump both exact pins,
        # run this workflow via workflow_dispatch, require the log to end
        # with "ALL CHECKS PASSED", then merge. Dependabot does not manage
        # these inline versions.
        run: npm install --no-save puppeteer@25.16.0 http-server@14.1.1

      - name: Capture screenshots
        run: node scripts/screenshot.js

      - name: Commit screenshots and test log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No doc changes"
          else
            git commit -m "chore: update screenshots + test log [skip ci]"
            # A concurrent main-branch update must not discard fresh screenshots.
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                exit 0
              fi
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "::error::Screenshot commit conflicts with concurrent main changes; resolve and rerun."
                exit 1
              fi
              sleep $((attempt * 2))
            done
            echo "::error::Could not push screenshot update after 3 attempts."
            exit 1
          fi
