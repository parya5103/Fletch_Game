name: Lighthouse

on:
  push:
    branches: [main]
  workflow_dispatch:

# Advisory-only job: read access is all it needs
permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      # Pinned to the immutable commit SHA of the v4 tag
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      # Advisory only - failures here do not block anything.
      - name: Run Lighthouse on the live site
        uses: treosh/lighthouse-ci-action@2e159d989f91bb9e399801b3e1ad90bcd4749f75 # v9
        with:
          urls: |
            https://parya5103.github.io/Fletch_Game/
          uploadArtifacts: true
          temporaryPublicStorage: true
        continue-on-error: true
