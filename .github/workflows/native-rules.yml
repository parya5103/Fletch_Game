name: Native C++ rules
on:
  pull_request:
    paths: ['native/**', '.github/workflows/native-rules.yml']
  push:
    branches: [main]
    paths: ['native/**', '.github/workflows/native-rules.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build native/build --parallel 2
      - name: Test
        run: ctest --test-dir native/build --output-on-failure
