name: Generate PWA icons

on:
  push:
    branches: [main]
    paths:
      - "scripts/gen-icons.js"
      - ".github/workflows/gen-icons.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate icons
        run: node scripts/gen-icons.js

      - name: Commit icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/*.png
          if git diff --cached --quiet; then
            echo "No icon changes to commit"
          else
            git commit -m "chore: regenerate PWA icons [skip ci]"
            git push
          fi
